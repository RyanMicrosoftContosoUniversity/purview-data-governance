[pytest]
# Default test discovery — unit tests only.
# Integration tests live under tests/integration/ and are excluded by default
# (they hit real Azure and take 5-10 minutes). Run them explicitly with:
#   RUN_INTEGRATION_TESTS=1 python -m pytest tests/integration/ -v
testpaths = tests
norecursedirs = tests/integration .git .venv __pycache__ .ruff_cache .pytest_cache

# Registered markers so unrecognized-marker warnings fail loudly when typos
# slip in. New markers must be added here.
markers =
    integration: end-to-end test that hits real Azure (Purview scan, EH, Function App, Atlas API). Requires RUN_INTEGRATION_TESTS=1 and a service-principal context.
