# =============================================================================
# Azure DevOps Multi-Stage Pipeline
# Purview Classification Function (fabric-delta-table-sensitivity-purview-int)
#
# Stages:
#   1. Validate    — Lint (ruff), unit tests (pytest)
#   2. ValidateIaC — terraform fmt -check + terraform validate (runs in parallel
#                    with Validate; gates Package along with Validate)
#   3. Package     — Install prod deps to .python_packages, zip the function
#   4. Deploy      — Zip-deploy to existing Flex Consumption Function App
#                    (main branch only)
#   5. Verify      — Confirm function is indexed and listener healthy
#
# Triggers only on changes under src/function/**.
# Assumes infra (Function App, Storage, App Insights, role assignments) is
# already provisioned via `terraform apply` in iac/. This pipeline only
# updates the function code.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - fabric-delta-table-sensitivity-purview-int/**
    exclude:
     - fabric-delta-table-sensitivity-purview-int/docs/**
     - fabric-delta-table-sensitivity-purview-int/**/*.md

pr: none

# ---------------------------------------------------------------------------
# Parameters — selectable at queue time
# ---------------------------------------------------------------------------
parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev

  - name: runTests
    displayName: Run Unit Tests
    type: boolean
    default: true

  - name: runLint
    displayName: Run Ruff Lint
    type: boolean
    default: true

  - name: runIaCValidation
    displayName: Run Terraform fmt + validate
    type: boolean
    default: true

  - name: runIntegrationTests
    displayName: 'Run E2E integration tests (Purview scan → Function → classification, ~5-10 min)'
    type: boolean
    default: false

  - name: deployFunction
    displayName: Deploy Function (main + feature/*)
    type: boolean
    default: true


variables:
  - group: purview-data-governance-${{ parameters.environment }}
  # Expected variables in the group:
  #   AZURE_SUBSCRIPTION_ID   - subscription hosting Purview + Function App
  #   RESOURCE_GROUP_NAME     - resource group for the Function App
  #   FUNCTION_APP_NAME       - Function App name
  # Variables consumed ONLY by the IntegrationTestE2E stage (safe to omit if
  # `runIntegrationTests=false`):
  #   PURVIEW_ACCOUNT         - e.g. governancePurviewRH
  #   PURVIEW_RESOURCE_GROUP  - e.g. governance-rg
  #   PURVIEW_DATA_SOURCE_NAME- e.g. Fabric
  #   PURVIEW_SCAN_NAME       - e.g. integration-test-scan
  #   PURVIEW_COLLECTION_ID   - e.g. bhhlid
  #   SOURCE_WORKSPACE_ID     - Fabric workspace ID under scan
  #   SOURCE_LAKEHOUSE_NAME   - lakehouse where the fixture table lives

  - name: serviceConnection
    value: sc-purview-data-governance-${{ parameters.environment }}

  - name: pythonVersion
    value: '3.11'

  - name: functionRoot
    value: fabric-delta-table-sensitivity-purview-int/src/function

  - name: iacRoot
    value: fabric-delta-table-sensitivity-purview-int/iac

  - name: terraformVersion
    value: '1.13.4'

  - name: vmImage
    value: ubuntu-latest


stages:
  - stage: Validate
    displayName: 'Validate (lint + tests)'
    pool:
      vmImage: $(vmImage)
    jobs:
      - job: ValidateJob
        displayName: 'Lint and test'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: $(pythonVersion)
              addToPath: true

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
              pip install ruff
            displayName: 'Install dependencies'
            workingDirectory: $(functionRoot)

          - ${{ if eq(parameters.runLint, true) }}:
              - script: |
                  set -euo pipefail
                  ruff format --check classify_assets/ sync_classification/ shared_utils/ function_app.py
                displayName: 'Ruff format check'
                workingDirectory: $(functionRoot)

          - ${{ if eq(parameters.runTests, true) }}:
              - script: |
                  set -euo pipefail
                  python -m pytest tests/ -x --tb=short --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml
                displayName: 'Run pytest'
                workingDirectory: fabric-delta-table-sensitivity-purview-int

              - task: PublishTestResults@2
                displayName: 'Publish test results'
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: $(Build.ArtifactStagingDirectory)/test-results.xml
                  testRunTitle: 'function unit tests (classify_assets + sync_classification)'


  # ---------------------------------------------------------------------------
  # IaC validation — terraform fmt + validate
  #
  # Runs in parallel with Validate. Catches drift in iac/ (formatting,
  # missing variables, broken references, provider-block errors) BEFORE the
  # function code is packaged and deployed. Skips `terraform plan` because
  # plan requires Azure credentials and a usable backend; that needs a more
  # heavyweight pipeline + service connection and is deferred to a separate
  # infra-only pipeline if/when needed.
  # ---------------------------------------------------------------------------
  - stage: ValidateIaC
    displayName: 'Validate IaC (terraform fmt + validate)'
    dependsOn: []
    condition: eq('${{ parameters.runIaCValidation }}', true)
    pool:
      vmImage: $(vmImage)
    jobs:
      - job: ValidateIaCJob
        displayName: 'terraform fmt + validate'
        steps:
          - script: |
              set -euo pipefail
              # Self-contained Terraform install via HashiCorp's apt repo
              # (avoids the Marketplace TerraformInstaller@1 task, which
              # requires the ms-devlabs extension to be installed in the ADO org).
              sudo apt-get update -y
              sudo apt-get install -y gnupg software-properties-common curl
              curl -fsSL https://apt.releases.hashicorp.com/gpg \
                | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                | sudo tee /etc/apt/sources.list.d/hashicorp.list
              sudo apt-get update -y
              # Pin to the exact version declared in $(terraformVersion).
              sudo apt-get install -y "terraform=$(terraformVersion)-*"
              terraform version
            displayName: 'Install Terraform $(terraformVersion)'

          - script: |
              set -euo pipefail
              terraform fmt -check -recursive -diff
            displayName: 'terraform fmt -check'
            workingDirectory: $(iacRoot)

          - script: |
              set -euo pipefail
              # -backend=false skips backend init (no Azure creds needed here).
              terraform init -backend=false -input=false
            displayName: 'terraform init (no backend)'
            workingDirectory: $(iacRoot)

          - script: |
              set -euo pipefail
              terraform validate
            displayName: 'terraform validate'
            workingDirectory: $(iacRoot)


  - stage: Package
    displayName: 'Package function'
    dependsOn:
      - Validate
      - ValidateIaC
    condition: |
      and(
        in(dependencies.Validate.result, 'Succeeded'),
        in(dependencies.ValidateIaC.result, 'Succeeded', 'Skipped')
      )
    pool:
      vmImage: $(vmImage)
    jobs:
      - job: PackageJob
        displayName: 'Build deployment zip'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: $(pythonVersion)
              addToPath: true

          - script: |
              set -euo pipefail
              # Install production dependencies into the package layout the
              # Functions host expects on Linux (.python_packages/lib/site-packages).
              python -m pip install --upgrade pip
              pip install \
                --target=".python_packages/lib/site-packages" \
                -r requirements.txt
            displayName: 'Install production dependencies'
            workingDirectory: $(functionRoot)

          - task: ArchiveFiles@2
            displayName: 'Archive function package'
            inputs:
              rootFolderOrFile: $(functionRoot)
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/function.zip
              replaceExistingArchive: true
              # Mirror exclusions from iac/function_app.tf archive_file.
              # ArchiveFiles@2 doesn't support glob excludes natively; we rely
              # on the fact that __pycache__/.pytest_cache/.ruff_cache aren't
              # generated on a clean agent. Tests folder is intentionally
              # included-or-excluded below via a pre-archive cleanup step.

          - script: |
              set -euo pipefail
              # Sanity check: confirm function_app.py is at the zip root.
              # Capture listing to a file first to avoid SIGPIPE (141) from
              # `unzip -l | head` under `set -o pipefail`.
              ziplist="$(mktemp)"
              unzip -l "$(Build.ArtifactStagingDirectory)/function.zip" > "$ziplist"
              head -40 "$ziplist"
              if ! grep -q '^.* function_app\.py$' "$ziplist"; then
                echo "##[error]function_app.py not found at zip root"
                exit 1
              fi
            displayName: 'Verify zip contents'

          - publish: $(Build.ArtifactStagingDirectory)/function.zip
            artifact: function-package
            displayName: 'Publish function-package artifact'

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Package
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
        ),
        eq('${{ parameters.deployFunction }}', true)
      )
    pool:
      vmImage: $(vmImage)
    jobs:
      - deployment: DeployFunction
        displayName: 'Zip-deploy to Function App'
        environment: purview-data-governance-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: function-package
                  displayName: 'Download function-package artifact'

                - task: AzureCLI@2
                  displayName: 'Zip-deploy to Flex Consumption app'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      ZIP_PATH="$(Pipeline.Workspace)/function-package/function.zip"
                      echo "Deploying $ZIP_PATH to $(FUNCTION_APP_NAME) in $(RESOURCE_GROUP_NAME)"
                      # Flex Consumption requires --build-remote false (zip already contains deps).
                      az functionapp deployment source config-zip \
                        --resource-group "$(RESOURCE_GROUP_NAME)" \
                        --name "$(FUNCTION_APP_NAME)" \
                        --src "$ZIP_PATH" \
                        --build-remote false


  - stage: Verify
    displayName: 'Verify deployment'
    dependsOn: Deploy
    condition: succeeded()
    pool:
      vmImage: $(vmImage)
    jobs:
      - job: VerifyJob
        displayName: 'Confirm function is indexed'
        steps:
          - task: AzureCLI@2
            displayName: 'List functions on app'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Give the host a moment to restart and re-index after the deploy.
                sleep 30
                FUNCS=$(az functionapp function list \
                  --resource-group "$(RESOURCE_GROUP_NAME)" \
                  --name "$(FUNCTION_APP_NAME)" \
                  --query "[].name" -o tsv)
                echo "Functions discovered:"
                echo "$FUNCS"
                MISSING=()
                for fn in classify_assets sync_classification; do
                  if ! echo "$FUNCS" | grep -q "$fn"; then
                    MISSING+=("$fn")
                  fi
                done
                if [ ${#MISSING[@]} -gt 0 ]; then
                  echo "##[error]Functions not indexed on $(FUNCTION_APP_NAME): ${MISSING[*]}"
                  exit 1
                fi
                echo "##[section]classify_assets and sync_classification are indexed and ready."



  - stage: IntegrationTestE2E
    displayName: 'Integration test (E2E: Purview scan -> Function -> classification)'
    dependsOn: Verify
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.runIntegrationTests }}', true)
      )
    pool:
      vmImage: $(vmImage)
    jobs:
      - job: IntegrationE2E
        displayName: 'Trigger scan, wait, assert classification'
        timeoutInMinutes: 30
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: $(pythonVersion)
              addToPath: true

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r src/function/requirements-dev.txt
            displayName: 'Install test dependencies'
            workingDirectory: fabric-delta-table-sensitivity-purview-int

          - task: AzureCLI@2
            displayName: 'Run integration tests (pytest tests/integration/)'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                cd fabric-delta-table-sensitivity-purview-int

                # Fail fast if the variable group is missing the integration
                # test variables (otherwise bash treats $(VAR) as command
                # substitution and emits a confusing "command not found").
                MISSING=()
                for v in PURVIEW_ACCOUNT PURVIEW_RESOURCE_GROUP \
                         PURVIEW_DATA_SOURCE_NAME PURVIEW_SCAN_NAME \
                         PURVIEW_COLLECTION_ID SOURCE_WORKSPACE_ID \
                         SOURCE_LAKEHOUSE_ID SOURCE_LAKEHOUSE_NAME; do
                  # Indirect expansion: ${!v} is the value of the var named $v.
                  if [ -z "${!v:-}" ]; then MISSING+=("$v"); fi
                done
                if [ ${#MISSING[@]} -gt 0 ]; then
                  echo "##[error]Variable group 'purview-data-governance-dev' is missing required variables: ${MISSING[*]}"
                  echo "##[error]Add them in ADO -> Pipelines -> Library. See docs/CICD.md."
                  exit 1
                fi

                # Gate the parent conftest's credential-mock + signal the
                # integration suite to actually collect.
                export RUN_INTEGRATION_TESTS=1
                python -m pytest tests/integration/ -v -s --tb=short \
                  --junitxml=$(Build.ArtifactStagingDirectory)/integration-results.xml
            env:
              AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
              PURVIEW_ACCOUNT: $(PURVIEW_ACCOUNT)
              PURVIEW_RESOURCE_GROUP: $(PURVIEW_RESOURCE_GROUP)
              PURVIEW_DATA_SOURCE_NAME: $(PURVIEW_DATA_SOURCE_NAME)
              PURVIEW_SCAN_NAME: $(PURVIEW_SCAN_NAME)
              PURVIEW_COLLECTION_ID: $(PURVIEW_COLLECTION_ID)
              SOURCE_WORKSPACE_ID: $(SOURCE_WORKSPACE_ID)
              SOURCE_LAKEHOUSE_ID: $(SOURCE_LAKEHOUSE_ID)
              SOURCE_LAKEHOUSE_NAME: $(SOURCE_LAKEHOUSE_NAME)

          - task: PublishTestResults@2
            displayName: 'Publish integration test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/integration-results.xml
              testRunTitle: 'E2E integration tests (Purview scan -> Function -> classification)'
